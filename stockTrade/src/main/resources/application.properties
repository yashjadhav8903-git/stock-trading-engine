spring.application.name=stockTrade

spring.datasource.url=jdbc:postgresql://localhost:5432/stocktrade?reWriteBatchedInserts=true&prepareThreshold=5
spring.datasource.username=postgres
spring.datasource.password=yash3035
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Enable Java Virtual Threads
spring.threads.virtual.enabled=true

# Tomcat HTTP Thread Pool (Requests queue me na latke)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# HikariCP DB Connection Pool Expansion (Timeout bachane ke liye)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000


spring.output.ansi.enabled=ALWAYS

# Default Root Logger
logging.level.root=INFO

# Tumhare project package ke liye custom DEBUG mode
logging.level.com.tradingEngine.stockTrade=DEBUG

# Spring Boot 3.x / Spring Data Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6381


# Google OAuth2 Settings
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
